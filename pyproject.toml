[project]
name = "embedding-experiments"
version = "0.1.0"
description = "The runnable experiments behind the embedding and retrieval articles on chekh.dev"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.25",
    "matplotlib>=3.10",
    "numpy>=2.1",
    "pyarrow>=17",
    "scikit-learn>=1.6",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
